<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Wiskr</title>
  <meta name="description" content="Naming a startup is hard. Finding out it's taken is worse. One search, and Wiskr tells you if it's yours.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f26a10'/%3E%3Cellipse cx='16' cy='16' rx='3.6' ry='12' fill='%230c0c0d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <radialGradient id="irisGrad" cx="50%" cy="45%" r="60%"><stop offset="0" style="stop-color:var(--iris-a)"/><stop offset="1" style="stop-color:var(--iris-b)"/></radialGradient>
  </defs></svg>

  <div class="stage">
    <section class="home" id="home">
      <div data-eyes></div>
      <h1 class="prompt" id="prompt" aria-live="polite">
        <span class="on">What’s your startup <em>called?</em></span>
        <span>What’s your startup’s <em>name?</em></span>
        <span>What will you <em>name</em> it?</span>
      </h1>
      <form class="search" id="f1" autocomplete="off">
        <input id="q1" name="q1" placeholder="Type a name…" maxlength="40" aria-label="Startup name" autofocus>
        <button class="go" type="submit" aria-label="Check name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="hint">Try <button type="button" data-ex="Lumora">Lumora</button>, <button type="button" data-ex="Quillbird">Quillbird</button> or <button type="button" data-ex="Nova">Nova</button></div>
      <div class="checks-line"><span><i></i>Trademarks</span><span><i></i>Domains</span><span><i></i>Social handles</span><span><i></i>Google</span></div>
    </section>

    <div id="app" hidden>
      <header class="bar">
        <button class="brand" id="home-btn" type="button" aria-label="Back to start"><span data-eyes></span><span class="word">Wiskr</span></button>
        <form class="search" id="f2" autocomplete="off">
          <input id="q2" name="q2" maxlength="40" aria-label="Startup name">
          <button class="go" type="submit" aria-label="Check name"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
        </form>
      </header>
      <main class="results" id="results"></main>
      <footer>Wiskr checks Canadian trademarks, domains, social handles and Google in one search.</footer>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
