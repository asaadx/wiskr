<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Wiskr</title>
  <meta name="description" content="Naming a startup is hard. Finding out it's taken is worse. One search, and Wiskr tells you if it's yours.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f26a10'/%3E%3Cellipse cx='16' cy='16' rx='3.6' ry='12' fill='%230c0c0d'/%3E%3C/svg%3E">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/instrument-serif-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/instrument-serif-latin-400-italic.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/fonts/geist-latin-wght-normal.woff2">
  <!-- Linked here (not imported from JS) so the page never paints unstyled -->
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <radialGradient id="irisGrad" cx="50%" cy="45%" r="60%"><stop offset="0" style="stop-color:var(--iris-a)"/><stop offset="1" style="stop-color:var(--iris-b)"/></radialGradient>
    <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".25" stop-color="#fa7e1e"/><stop offset=".5" stop-color="#d62976"/><stop offset=".75" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient>
  </defs></svg>

  <div class="stage" id="stage">
    <header class="bar">
      <button class="brand" id="home-btn" type="button" aria-label="Start over"><svg class="eyes cat" viewBox="0 0 160 132" aria-hidden="true"><g class="fur"><path d="M28 52 30 8 66 28Z"/><path d="M132 52 130 8 94 28Z"/></g><g class="ear"><path d="M35 40 36 20 54 31Z"/><path d="M125 40 124 20 106 31Z"/></g><path class="fur" d="M22 70C22 38 50 22 80 22s58 16 58 48c0 34-26 54-58 54S22 104 22 70Z"/><g class="stripe"><path d="M56 32l4 14M44 40l6 12M104 32l-4 14M116 40l-6 12M24 80l12 2M26 92h12M136 80l-12 2M134 92h-12"/></g><path class="blaze" d="M80 34c6 12 6 26 10 42 14 4 22 16 18 30-6 14-18 18-28 18s-22-4-28-18c-4-14 4-26 18-30 4-16 4-30 10-42Z"/><g class="eye"><clipPath id="c52a"><path d="M32 68 Q52 46.3 72 68 Q52 89.7 32 68 Z"/></clipPath><path class="lid" d="M32 68 Q52 46.3 72 68 Q52 89.7 32 68 Z"/><g clip-path="url(#c52a)"><circle class="iris" cx="52" cy="68" r="12.5"/><g class="look"><ellipse class="pupil" cx="52" cy="68" rx="2.8" ry="10.4" style="transform-box:fill-box;transform-origin:center"/><circle class="shine" cx="56.2" cy="63" r="2"/></g></g><path class="rim" d="M32 68 Q52 46.3 72 68 Q52 89.7 32 68 Z"/></g><g class="eye"><clipPath id="c108a"><path d="M88 68 Q108 46.3 128 68 Q108 89.7 88 68 Z"/></clipPath><path class="lid" d="M88 68 Q108 46.3 128 68 Q108 89.7 88 68 Z"/><g clip-path="url(#c108a)"><circle class="iris" cx="108" cy="68" r="12.5"/><g class="look"><ellipse class="pupil" cx="108" cy="68" rx="2.8" ry="10.4" style="transform-box:fill-box;transform-origin:center"/><circle class="shine" cx="112.2" cy="63" r="2"/></g></g><path class="rim" d="M88 68 Q108 46.3 128 68 Q108 89.7 88 68 Z"/></g><path class="nose" d="M74 89q6-3 12 0-2 6-6 8-4-2-6-8Z"/><path class="mouth" d="M80 97v5m0 0q-5 6-10 2m10-2q5 6 10 2"/><path class="whisker" d="M58 98 14 90M58 103l-46 1M58 108l-42 10M102 98l44-8M102 103l46 1M102 108l42 10"/></svg><span class="word">Wiskr</span></button>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>

    <section class="intro">
      <svg class="eyes cat" viewBox="0 0 160 132" aria-hidden="true"><g class="fur"><path d="M28 52 30 8 66 28Z"/><path d="M132 52 130 8 94 28Z"/></g><g class="ear"><path d="M35 40 36 20 54 31Z"/><path d="M125 40 124 20 106 31Z"/></g><path class="fur" d="M22 70C22 38 50 22 80 22s58 16 58 48c0 34-26 54-58 54S22 104 22 70Z"/><g class="stripe"><path d="M56 32l4 14M44 40l6 12M104 32l-4 14M116 40l-6 12M24 80l12 2M26 92h12M136 80l-12 2M134 92h-12"/></g><path class="blaze" d="M80 34c6 12 6 26 10 42 14 4 22 16 18 30-6 14-18 18-28 18s-22-4-28-18c-4-14 4-26 18-30 4-16 4-30 10-42Z"/><g class="eye"><clipPath id="c52b"><path d="M32 68 Q52 46.3 72 68 Q52 89.7 32 68 Z"/></clipPath><path class="lid" d="M32 68 Q52 46.3 72 68 Q52 89.7 32 68 Z"/><g clip-path="url(#c52b)"><circle class="iris" cx="52" cy="68" r="12.5"/><g class="look"><ellipse class="pupil" cx="52" cy="68" rx="2.8" ry="10.4" style="transform-box:fill-box;transform-origin:center"/><circle class="shine" cx="56.2" cy="63" r="2"/></g></g><path class="rim" d="M32 68 Q52 46.3 72 68 Q52 89.7 32 68 Z"/></g><g class="eye"><clipPath id="c108b"><path d="M88 68 Q108 46.3 128 68 Q108 89.7 88 68 Z"/></clipPath><path class="lid" d="M88 68 Q108 46.3 128 68 Q108 89.7 88 68 Z"/><g clip-path="url(#c108b)"><circle class="iris" cx="108" cy="68" r="12.5"/><g class="look"><ellipse class="pupil" cx="108" cy="68" rx="2.8" ry="10.4" style="transform-box:fill-box;transform-origin:center"/><circle class="shine" cx="112.2" cy="63" r="2"/></g></g><path class="rim" d="M88 68 Q108 46.3 128 68 Q108 89.7 88 68 Z"/></g><path class="nose" d="M74 89q6-3 12 0-2 6-6 8-4-2-6-8Z"/><path class="mouth" d="M80 97v5m0 0q-5 6-10 2m10-2q5 6 10 2"/><path class="whisker" d="M58 98 14 90M58 103l-46 1M58 108l-42 10M102 98l44-8M102 103l46 1M102 108l42 10"/></svg>
      <h1 class="prompt" id="prompt">
        <span class="on">What’s your startup <em>called?</em></span>
        <span>What’s your startup’s <em>name?</em></span>
        <span>What will you <em>name</em> it?</span>
      </h1>
    </section>

    <div class="composer">
      <form class="search" id="form" autocomplete="off">
        <input id="q" name="q" placeholder="Type a name…" maxlength="40" aria-label="Startup name" autofocus>
        <button class="go" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
      </form>
      <div class="hint examples">Try <button type="button" data-ex="Lumora">Lumora</button>, <button type="button" data-ex="Quillbird">Quillbird</button> or <button type="button" data-ex="Nova">Nova</button></div>
      <!-- Icons: Tabler (outline) -->
      <div class="checks-line"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9h5m-2.5 0v6"/><path d="M13 15v-6l3 4l3 -4v6"/></svg>Trademarks</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M3.6 9h16.8"/><path d="M3.6 15h16.8"/><path d="M11.5 3a17 17 0 0 0 0 18"/><path d="M12.5 3a17 17 0 0 1 0 18"/></svg>Domains</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0v-1.5a9 9 0 1 0 -5.5 8.28"/></svg>Social handles</span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/><path d="M21 21l-6 -6"/></svg>Search engine</span></div>
      <div class="hint"><span id="mode-q">No name yet?</span> <button type="button" id="mode-btn">Get name ideas</button></div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
